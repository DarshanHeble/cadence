[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
description = "Schedule git commits to appear as steady daily progress on GitHub"

[[bin]]
name = "cadence"
path = "src/main.rs"

[[bin]]
name = "cad"
path = "src/bin/cad.rs"


[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
ratatui = "0.26"
crossterm = "0.27"
regex = "1.10"
